<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Winplus - Inicio de Sesión</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex justify-center items-center min-h-screen">
    <div class="bg-white shadow-lg rounded-lg p-6 w-96" id="authContainer">
        <h2 class="text-center text-2xl font-bold text-blue-600">Winplus</h2>
        <form id="loginForm" class="mt-4">
            <label class="block text-gray-700">Correo electrónico</label>
            <input type="email" id="loginEmail" class="w-full p-2 border rounded mt-1" placeholder="Correo electrónico" required>
            
            <label class="block text-gray-700 mt-3">Contraseña</label>
            <input type="password" id="loginPassword" class="w-full p-2 border rounded mt-1" placeholder="Contraseña" required>
            
            <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded mt-4 hover:bg-blue-700">Iniciar sesión</button>
            <p id="loginError" class="text-red-500 text-center mt-2 hidden">Credenciales incorrectas</p>
        </form>
    </div>

    <script>
        document.getElementById("loginForm").addEventListener("submit", function(event) {
            event.preventDefault();
            const email = document.getElementById("loginEmail").value;
            const password = document.getElementById("loginPassword").value;
            const storedEmail = localStorage.getItem("userEmail");
            const storedPassword = localStorage.getItem("userPassword");
            
            if (email === storedEmail && password === storedPassword) {
                window.location.href = "dashboard.html";
            } else {
                document.getElementById("loginError").classList.remove("hidden");
            }
        });
    </script>
</body>
</html>
